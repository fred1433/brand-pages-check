name: preview
# Runs from main's copy of this file after the checks of a pull request, so a pull request cannot
# change how previews are deployed or reach the deployment token.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  deploy:
    # Only pull requests from branches of this repository get a deployment (never forks).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: vertical-printers
            project: VERCEL_PROJECT_VP
            prefix: vp
          - brand: brand-b
            project: VERCEL_PROJECT_BB
            prefix: bb
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars[matrix.project] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: preview-${{ matrix.brand }}
          path: apps/${{ matrix.brand }}/.vercel
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: deploy the preview
        id: deploy
        working-directory: apps/${{ matrix.brand }}
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # One preview address per commit: the page reviewed is exactly the change that gets merged.
          ALIAS="${{ matrix.prefix }}-${HEAD_SHA:0:7}.pr.theaipipe.com"
          URL=$(npx --yes vercel@latest deploy --prebuilt --yes --token "${{ secrets.VERCEL_TOKEN }}" --scope fred1433s-projects)
          npx --yes vercel@latest alias set "$URL" "$ALIAS" --token "${{ secrets.VERCEL_TOKEN }}" --scope fred1433s-projects
          echo "url=https://$ALIAS" >> "$GITHUB_OUTPUT"
      - run: npx playwright install --with-deps chromium
      - name: check the preview in a signed-out browser
        env:
          BP_BASE_URL: ${{ steps.deploy.outputs.url }}
          BP_BRAND: ${{ matrix.brand }}
          BP_EXPECT_ENV: preview
          BP_MANIFEST: apps/${{ matrix.brand }}/.vercel/route-manifest.json
        run: npx playwright test
      - name: post the preview link on the pull request
        if: matrix.brand == 'vertical-printers'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/pulls" --jq '.[0].number')
          [ -n "$PR" ] && gh pr comment "$PR" --repo "${{ github.repository }}" --body "Preview of commit ${HEAD_SHA:0:7}, checked in a signed-out browser against its own pages (forms routed to the test list, no Ads requests): ${{ steps.deploy.outputs.url }}"
